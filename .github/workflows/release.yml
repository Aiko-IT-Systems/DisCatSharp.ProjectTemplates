name: "Release DisCatSharp.ProjectTemplates"

on:
    workflow_dispatch:

permissions:
    contents: write
    id-token: write
    attestations: write
    packages: write

concurrency:
    group: release
    cancel-in-progress: false

env:
    DOTNET_NOLOGO: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: true
    GH_TOKEN: ${{ github.token }}

jobs:
    release:
        timeout-minutes: 30
        runs-on: windows-latest
        name: Build, attest, and release

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Read version
              id: version
              shell: pwsh
              run: |
                  $version = (Get-Content -Path ./version.txt -Raw).Trim()
                  "version=$version" >> $env:GITHUB_OUTPUT
                  "tag=v$version" >> $env:GITHUB_OUTPUT
                  "title=DisCatSharp.ProjectTemplates v$version" >> $env:GITHUB_OUTPUT

            - name: Setup .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: |
                      11.x
                      10.x
                      9.x

            - name: Setup NuGet CLI
              uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
              with:
                  nuget-version: latest

            - name: Build NuGet package
              shell: pwsh
              run: pwsh ./build-nuget.ps1

            - name: Collect artifacts
              id: artifacts
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path ./release-artifacts | Out-Null
                  $packages = Get-ChildItem -Path ./nupkg -Filter *.nupkg |
                      Where-Object { $_.Name -notmatch '\.symbols\.' }
                  if ($packages.Count -eq 0) {
                      Write-Error "No .nupkg files found in ./nupkg — build may have failed."
                      exit 1
                  }
                  $packages | Copy-Item -Destination ./release-artifacts/
                  $nupkg = (Get-ChildItem ./release-artifacts -Filter *.nupkg | Select-Object -First 1).FullName
                  Write-Host "Package: $nupkg"
                  "nupkg=$nupkg" >> $env:GITHUB_OUTPUT

            - name: Generate build provenance attestation
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: "release-artifacts/*.nupkg"

            - name: Verify build provenance
              env:
                  NUPKG: ${{ steps.artifacts.outputs.nupkg }}
              shell: pwsh
              run: |
                  function Invoke-WithRetry {
                      param(
                          [scriptblock]$Action,
                          [int]$MaxAttempts = 6,
                          [int]$DelaySeconds = 5
                      )

                      for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
                          & $Action
                          if ($LASTEXITCODE -eq 0) {
                              return
                          }

                          if ($attempt -lt $MaxAttempts) {
                              Start-Sleep -Seconds $DelaySeconds
                          }
                      }

                      exit $LASTEXITCODE
                  }

                  Invoke-WithRetry { gh attestation verify $env:NUPKG --repo $env:GITHUB_REPOSITORY }

            - name: Create or update draft release
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  RELEASE_TITLE: ${{ steps.version.outputs.title }}
                  VERSION: ${{ steps.version.outputs.version }}
                  NUPKG: ${{ steps.artifacts.outputs.nupkg }}
              shell: pwsh
              run: |
                  $isPrerelease = $env:VERSION -match '(nightly|pre|alpha|beta|rc)'

                  gh release view $env:RELEASE_TAG *> $null
                  if ($LASTEXITCODE -eq 0) {
                      gh release upload $env:RELEASE_TAG $env:NUPKG --clobber
                      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                      return
                  }

                  $arguments = @(
                      $env:RELEASE_TAG,
                      '--draft',
                      '--target', $env:GITHUB_SHA,
                      '--title', $env:RELEASE_TITLE,
                      '--generate-notes'
                  )

                  if ($isPrerelease) {
                      $arguments += @('--prerelease', '--latest=false')
                  } else {
                      $arguments += '--latest'
                  }

                  gh release create @arguments
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

                  gh release upload $env:RELEASE_TAG $env:NUPKG --clobber
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: NuGet login (OIDC → temp API key)
              uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
              id: nuget_login
              with:
                  user: ${{ secrets.NUGET_USER }}

            - name: Publish packages to NuGet (with retry)
              shell: pwsh
              env:
                  NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
                  NUPKG: ${{ steps.artifacts.outputs.nupkg }}
              run: |
                  for ($i = 1; $i -le 3; $i++) {
                      dotnet nuget push $env:NUPKG `
                          --source https://api.nuget.org/v3/index.json `
                          --api-key $env:NUGET_API_KEY `
                          --skip-duplicate
                      if ($LASTEXITCODE -eq 0) { break }
                      if ($i -lt 3) { Start-Sleep -Seconds 10 }
                      else { exit $LASTEXITCODE }
                  }

            - name: Publish to GitHub Packages
              shell: pwsh
              env:
                  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NUPKG: ${{ steps.artifacts.outputs.nupkg }}
              run: |
                  dotnet nuget push $env:NUPKG `
                      --source https://nuget.pkg.github.com/Aiko-IT-Systems/index.json `
                      --api-key $env:GITHUB_PACKAGES_TOKEN `
                      --skip-duplicate
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Publish immutable GitHub Release
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  VERSION: ${{ steps.version.outputs.version }}
              shell: pwsh
              run: |
                  $isPrerelease = $env:VERSION -match '(nightly|pre|alpha|beta|rc)'
                  $latest = if ($isPrerelease) { 'false' } else { 'true' }
                  gh release edit $env:RELEASE_TAG --draft=false --latest=$latest
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Verify immutable release and attestations
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  NUPKG: ${{ steps.artifacts.outputs.nupkg }}
              shell: pwsh
              run: |
                  function Invoke-WithRetry {
                      param(
                          [scriptblock]$Action,
                          [int]$MaxAttempts = 12,
                          [int]$DelaySeconds = 5
                      )

                      for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
                          & $Action
                          if ($LASTEXITCODE -eq 0) {
                              return
                          }

                          if ($attempt -lt $MaxAttempts) {
                              Start-Sleep -Seconds $DelaySeconds
                          }
                      }

                      exit $LASTEXITCODE
                  }

                  Invoke-WithRetry { gh release verify $env:RELEASE_TAG }
                  Invoke-WithRetry { gh attestation verify $env:NUPKG --repo $env:GITHUB_REPOSITORY }
