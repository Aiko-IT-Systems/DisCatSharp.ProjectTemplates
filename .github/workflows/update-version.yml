name: "Update DisCatSharp Version"

on:
    schedule:
        # Runs every day at 06:00 UTC
        - cron: "0 6 * * *"
    workflow_dispatch:
        inputs:
            force_version:
                description: "Force a specific version (leave empty to auto-detect)"
                required: false
                type: string
            wait_minutes:
                description: "Wait time in minutes for the release workflow to run (default: 0)"
                required: false
                type: number
                default: 0
    workflow_call:
        inputs:
            force_version:
                description: "Force a specific version (leave empty to auto-detect)"
                required: false
                type: string
            wait_minutes:
                description: "Wait time in minutes for the release workflow to run (default: 0)"
                required: false
                type: number
                default: 0

permissions:
    contents: write
    actions: write
    id-token: write
    attestations: write
    packages: write

concurrency:
    group: update-version
    cancel-in-progress: true

env:
    GH_TOKEN: ${{ github.token }}

jobs:
    check-and-update:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        name: Check for new DisCatSharp release and update
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}
            - name: Read current version
              id: current
              run: |
                  version=$(cat version.txt | tr -d '[:space:]')
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  echo "Current version.txt: ${version}"
            - name: Wait
              if: ${{ inputs.wait_minutes > 0 }}
              run: |
                  echo "Waiting for ${inputs.wait_minutes} minutes before checking for new release..."
                  sleep $((inputs.wait_minutes * 60))
            - name: Resolve target version
              id: target
              env:
                  FORCE_VERSION: ${{ inputs.force_version }}
              run: |
                  if [ -n "$FORCE_VERSION" ]; then
                    echo "version=${FORCE_VERSION}" >> "$GITHUB_OUTPUT"
                    echo "Using forced version: ${FORCE_VERSION}"
                    exit 0
                  fi

                  # Try nightly release first (tagged like 10.x.x-nightly-NNN)
                  nightly=$(gh api "repos/Aiko-IT-Systems/DisCatSharp/releases" \
                    --jq '[.[] | select(.tag_name | test("nightly"; "i"))] | first | .tag_name // empty' \
                    2>/dev/null || true)

                  # Fall back to latest stable release
                  stable=$(gh api "repos/Aiko-IT-Systems/DisCatSharp/releases/latest" \
                    --jq '.tag_name // empty' \
                    2>/dev/null || true)

                  # Strip leading "v" if present
                  nightly="${nightly#v}"
                  stable="${stable#v}"

                  # Prefer nightly when available
                  if [ -n "$nightly" ]; then
                    echo "version=${nightly}" >> "$GITHUB_OUTPUT"
                    echo "Resolved latest nightly: ${nightly}"
                  elif [ -n "$stable" ]; then
                    echo "version=${stable}" >> "$GITHUB_OUTPUT"
                    echo "Resolved latest stable: ${stable}"
                  else
                    echo "::error::Could not resolve a DisCatSharp release version"
                    exit 1
                  fi
            - name: Check if update is needed
              id: diff
              env:
                  CURRENT: ${{ steps.current.outputs.version }}
                  TARGET: ${{ steps.target.outputs.version }}
              run: |
                  if [ "$CURRENT" = "$TARGET" ]; then
                    echo "up_to_date=true" >> "$GITHUB_OUTPUT"
                    echo "Version is already up-to-date: ${CURRENT}"
                  else
                    echo "up_to_date=false" >> "$GITHUB_OUTPUT"
                    echo "Update needed: ${CURRENT} → ${TARGET}"
                  fi
            - name: Update version.txt
              if: steps.diff.outputs.up_to_date == 'false'
              env:
                  TARGET: ${{ steps.target.outputs.version }}
              run: |
                  echo "$TARGET" > version.txt
                  echo "Written ${TARGET} to version.txt"
            - name: Update DisCatSharp package versions in csproj files
              if: steps.diff.outputs.up_to_date == 'false'
              env:
                  TARGET: ${{ steps.target.outputs.version }}
              run: |
                  # Only update DisCatSharp.* packages whose current version matches the
                  # main DisCatSharp release pattern (e.g. 10.x.x or 10.x.x-nightly-NNN).
                  # This leaves DisCatSharp.Analyzer (version 1.x.x.x) untouched.
                  find src/Content -name '*.csproj' | while read -r csproj; do
                    perl -i -pe \
                      's|(Include="DisCatSharp(?:\.[A-Za-z.]+)?" Version=")(\d{2,}\.[^"]+)(")|${1}'"${TARGET}"'${3}|g' \
                      "$csproj"
                    echo "Updated $csproj"
                  done
            - name: Commit and push updated version
              if: steps.diff.outputs.up_to_date == 'false'
              env:
                  TARGET: ${{ steps.target.outputs.version }}
                  CURRENT: ${{ steps.current.outputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add version.txt src/Content
                  git commit -m "chore: bump DisCatSharp version ${CURRENT} → ${TARGET}"
                  git push
            - name: Trigger release workflow
              if: steps.diff.outputs.up_to_date == 'false'
              run: |
                  gh workflow run release.yml --ref main
                  echo "Triggered release.yml"
